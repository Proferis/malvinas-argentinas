name: Novedades y serie diaria

on:
  schedule:
    # 09:17 UTC = 06:17 en Argentina, una vez por día
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novedades
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Recolectar novedades y registrar el punto del día
        run: node scripts/scrape.mjs

      - name: Commitear si hay cambios
        run: |
          if [ -n "$(git status --porcelain data/novedades.js data/historial.js)" ]; then
            git config user.name "prometeo-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/novedades.js data/historial.js
            git commit -m "datos: actualización automática"
            git push
          else
            echo "Sin cambios que commitear"
          fi
